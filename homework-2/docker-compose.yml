services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  swagger-ui:
    image: swaggerapi/swagger-ui
    profiles: ["docs"]
    ports:
      - "8081:8080"
    environment:
      - SWAGGER_JSON=/app/swagger.yaml
    volumes:
      - ./docs/swagger.yaml:/app/swagger.yaml:ro
    depends_on:
      api:
        condition: service_healthy
